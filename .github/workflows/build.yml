name: Compilar APK de Idiomas en la Nube

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente desde el repositorio
      uses: actions/checkout@v4
      
    - name: Configurar Entorno de Node.js v20 (Igual al Entorno Local)
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Configurar Java 21 usando la Acción v5
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Instalar Dependencias del Proyecto
      run: |
        npm ci

    - name: Compilar Proyecto Web e Inyectar en Android
      run: |
        npm run build --if-present
        npx cap sync android

    - name: Compilar APK usando el Gradle del Proyecto
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir el APK Terminado para su Descarga
      uses: actions/upload-artifact@v4
      with:
        name: app-idiomas-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
