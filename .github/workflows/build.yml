name: Compilar APK de Idiomas en la Nube

on:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Descargar el código fuente desde el repositorio
      uses: actions/checkout@v4

    - name: Configurar Entorno de Node.js v24 (Versión Actualizada 2026)
      uses: actions/setup-node@v4
      with:
        node-version: 24

    - name: Configurar Java 21 usando la Acción v5 (Sin Advertencias)
      uses: actions/setup-java@v5
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Instalar Dependencias del Proyecto
      run: |
        npm ci

    - name: Compilar Proyecto Web (Generar Código Limpio)
      run: |
        npm run build --if-present

    - name: Actualizar y Sincronizar Plugins Nativos en Android
      run: |
        npx cap sync android

    - name: Compilar APK usando el Gradle del Proyecto
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Subir el APK Terminado para su Descarga
      uses: actions/upload-artifact@v4
      with:
        name: app-idiomas-debug-apk
        path: android/app/build/outputs/apk/debug/app-debug.apk
